# Netlify configuration for the Angular frontend.
# The site's base directory is "portfolio-frontend", so paths here are relative to it.
[build]
  command = "npm run build"
  publish = "dist/portfolio-frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# Serve index.html for client-side routes like /about or /projects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
